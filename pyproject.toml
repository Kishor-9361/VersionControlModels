[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vcm-ml"
version = "1.0.0"
description = "VCM - Model DNA Version Control Platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kishor Veeraragavan" }]
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "tabulate>=0.9.0",
    "GitPython>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/Kishor-9361/VersionControlModels"
Repository = "https://github.com/Kishor-9361/VersionControlModels"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
mlflow = [
    "mlflow>=2.0.0",
]

[project.scripts]
vcm = "vcm.cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["vcm/tests"]
python_files = ["test_*.py"]
addopts = "-v"
filterwarnings = [
    "ignore:.*isolated_filesystem.*:DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["venv", "build", "dist"]

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "pandas.*",
    "numpy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vcm.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_unused_ignores = false
ignore_missing_imports = true
