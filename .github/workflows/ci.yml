name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mlflow]"

      - name: Run Flake8 linter
        run: |
          flake8 vcm

      - name: Run MyPy strict type checker
        run: |
          mypy vcm

      - name: Run Pytest test suite with coverage
        run: |
          pytest vcm/tests/ -v --cov=vcm --cov-report=xml --cov-report=term
